name: setup-xezim
description: Install a prebuilt xezim binary
branding:
  color: green
  icon: download
inputs:
  version:
    description: "xezim release to install (for example 0.11.7). Defaults to the latest package release."
    required: false
    default: latest
  ubuntu-version:
    description: "Ubuntu asset to use (`auto` = match the runner VERSION_ID, usually 26.04 on ubuntu-latest)."
    required: false
    default: auto
runs:
  using: composite
  steps:
    - name: Install xezim
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091
        . /etc/os-release
        if [ "${ID:-}" != "ubuntu" ]; then
          echo "setup-xezim supports Ubuntu only (this runner is ${ID:-unknown})" >&2
          exit 1
        fi
        ubuntu="${{ inputs.ubuntu-version }}"
        if [ "$ubuntu" = "auto" ]; then
          ubuntu="${VERSION_ID:-}"
        fi
        case "$ubuntu" in
          24.04|26.04) ;;
          *)
            echo "setup-xezim supports ubuntu-24.04 and ubuntu-26.04 (requested ${ubuntu})" >&2
            exit 1
            ;;
        esac
        version="${{ inputs.version }}"
        asset="xezim-ubuntu-${ubuntu}.tar.gz"
        if [ "$version" = "latest" ]; then
          url="https://github.com/daxzio/xezim-package/releases/latest/download/${asset}"
        else
          url="https://github.com/daxzio/xezim-package/releases/download/${version}/${asset}"
        fi
        dest="${RUNNER_TEMP}/xezim"
        rm -rf "$dest"
        mkdir -p "$dest"
        curl -fsSL "$url" | tar -xz -C "$dest"
        if [ ! -x "$dest/bin/xezim" ]; then
          echo "archive from ${url} did not contain bin/xezim" >&2
          exit 1
        fi
        echo "$dest/bin" >> "$GITHUB_PATH"