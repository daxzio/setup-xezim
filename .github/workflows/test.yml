name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xezim
        uses: ./
        with:
          version: "0.11.6"

      - name: Report version
        run: |
          xezim -V
          xezim -V | grep -F "xezim version 0.11.6"
