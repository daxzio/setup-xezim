name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xezim
        uses: ./
        with:
          version: "0.11.7"

      - name: Report version
        run: |
          xezim -V
          xezim -V | grep -F "xezim version 0.11.7"